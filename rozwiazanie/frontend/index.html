<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3152">
  <title>Rejestr AED — wyszukiwarka defibrylatorów</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #242a30;
      background: #f3f4f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #0066a4;
      --navy: #082d4b;
      --orange: #d72d00;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select { font: inherit; }
    a { color: var(--blue); }
    .topbar { height: 58px; background: #fff; border-bottom: 1px solid #d5d9dc; }
    .topbar__inner {
      width: min(1120px, calc(100% - 32px)); height: 100%; margin: auto;
      display: flex; align-items: center; gap: 18px;
    }
    .brand-mark {
      width: 44px; height: 42px; display: grid; place-items: center;
      background: #d40024; color: #fff; font-weight: 800; letter-spacing: .03em;
    }
    .brand { color: #20252a; font-family: Georgia, serif; font-size: 21px; text-decoration: none; }
    .topbar__links { margin-left: auto; display: flex; gap: 26px; font-size: 14px; font-weight: 650; }
    .topbar__links a { text-decoration: none; }
    .hero {
      color: #fff;
      background:
        radial-gradient(ellipse at 82% 25%, rgba(52, 127, 170, .42), transparent 35%),
        linear-gradient(118deg, #082844, #164f7d 72%, #0c3658);
      padding: 28px 16px 42px;
    }
    .hero__inner, .results { width: min(1120px, 100%); margin: 0 auto; }
    .identity { display: flex; align-items: center; gap: 18px; margin: 0 0 18px; }
    .identity__acronym { font-family: Georgia, serif; font-size: 48px; line-height: 1; letter-spacing: .04em; }
    .identity__name { font-size: 19px; line-height: 1.18; font-weight: 700; }
    .intro { margin: 0 0 20px; font-size: 15px; line-height: 1.55; }
    .intro strong { display: block; margin-bottom: 5px; }
    .intro ul { list-style: none; margin: 0; padding: 0; }
    .intro li::before { content: "•"; color: #ef4b13; font-size: 20px; margin-right: 10px; }
    .search-panel {
      background: #fff; color: #242a30; padding: 27px 28px 20px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .13);
    }
    .search-panel h1 { margin: 0 0 20px; font-size: 21px; }
    .fields { display: grid; grid-template-columns: 1.1fr 1.1fr .75fr 178px; }
    .fields input, .fields select {
      min-width: 0; height: 46px; padding: 0 14px; border: 1px solid #cfd3d6;
      border-right: 0; border-radius: 0; color: #303941; background: #fff;
    }
    .fields input::placeholder { color: #687889; opacity: 1; }
    .fields input:focus, .fields select:focus, .advanced input:focus {
      position: relative; z-index: 1; outline: 3px solid #80bdff; outline-offset: -3px;
    }
    .search-button {
      border: 0; min-height: 46px; padding: 0 20px; background: var(--orange);
      color: #fff; font-weight: 700; cursor: pointer;
    }
    .search-button svg { width: 18px; height: 18px; margin-left: 5px; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2.4; }
    .search-button:hover { background: #b92500; }
    .search-button:focus-visible, .text-button:focus-visible, .advanced-toggle:focus-visible,
    .pagination button:focus-visible, a:focus-visible { outline: 3px solid #ffc400; outline-offset: 2px; }
    .search-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
    .nearest-button {
      display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px;
      border: 2px solid var(--orange); background: #fff; color: var(--orange); font-weight: 700; cursor: pointer;
    }
    .nearest-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .nearest-button:hover { background: #fff3ef; }
    .nearest-button:focus-visible { outline: 3px solid #ffc400; outline-offset: 2px; }
    .result__distance { color: var(--orange); font-weight: 700; }
    .advanced-toggle, .text-button {
      border: 0; background: none; padding: 8px 0; color: #005ea8; font-weight: 650;
      text-decoration: underline; cursor: pointer;
    }
    .advanced-toggle::after { content: "⌄"; display: inline-block; margin-left: 7px; text-decoration: none; }
    .advanced-toggle[aria-expanded="true"]::after { content: "⌃"; }
    .text-button { border: 1px solid #1681cb; padding: 8px 18px; text-decoration: none; }
    .advanced {
      display: none; grid-template-columns: minmax(200px, 1fr) minmax(200px, 1fr);
      gap: 16px 24px; padding-top: 18px; margin-top: 16px; border-top: 1px solid #e1e4e6;
    }
    .advanced.is-open { display: grid; }
    .advanced label { display: grid; gap: 7px; font-size: 14px; font-weight: 650; }
    .advanced select { height: 42px; padding: 0 10px; border: 1px solid #cfd3d6; background: #fff; }
    .check { display: flex !important; align-items: center; gap: 9px !important; align-self: end; min-height: 42px; }
    .check input { width: 18px; height: 18px; accent-color: var(--blue); }
    .results-wrap { padding: 28px 16px 48px; }
    .results__bar {
      min-height: 64px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
    }
    .results__bar h2 { margin: 0; font-size: 20px; }
    .results__count { color: #4d5962; font-size: 14px; }
    .result-list { display: grid; gap: 12px; }
    .result {
      padding: 20px 22px; background: #fff; border: 1px solid #e1e4e6;
      border-left: 5px solid #0b6ca7; box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
    }
    .result__top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
    .result h3 { margin: 0; color: #202b34; font-size: 18px; }
    .badge { padding: 4px 9px; background: #e6f3eb; color: #176239; border-radius: 2px; font-size: 12px; font-weight: 700; }
    .badge--unknown { background: #eef0f2; color: #4d5962; }
    .admin-link { border: 0; background: none; color: var(--blue); font-weight: 650; cursor: pointer; padding: 0; }
    .admin-bar { background: #fff6e5; border-bottom: 1px solid #f0c36d; font-size: 14px; }
    .admin-bar__inner { width: min(1120px, calc(100% - 32px)); margin: auto; padding: 9px 0;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .admin-bar input { height: 34px; padding: 0 10px; border: 1px solid #cfd3d6; min-width: 0; }
    .admin-bar button { height: 34px; padding: 0 14px; border: 0; background: var(--blue); color: #fff; cursor: pointer; }
    .admin-bar__error { color: #b00020; }
    .protected { margin: 10px 0 4px; padding: 10px 12px; border-left: 4px solid #f0a500; background: #fffaf0; }
    .protected h4 { margin: 0 0 6px; font-size: 13px; color: #7a5200; }
    .protected dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
    .protected dt { color: #56636d; }
    .protected dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 560px) { .protected dl { grid-template-columns: 1fr; } .protected dd { margin-bottom: 4px; } }
    .result__address { margin: 11px 0 5px; font-size: 15px; }
    .result__description, .result__meta { margin: 5px 0; color: #56636d; font-size: 14px; line-height: 1.5; }
    .result__links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 14px; font-weight: 650; }
    .notice { padding: 24px; background: #fff; text-align: center; color: #4e5961; border: 1px solid #e4e6e8; }
    .notice[hidden] { display: none; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 20px 0; }
    .pagination button { padding: 8px 14px; color: #005ea8; background: #fff; border: 1px solid #1681cb; cursor: pointer; }
    .pagination button:disabled { opacity: .45; cursor: default; }
    .pagination span { font-size: 14px; }
    @media (max-width: 760px) {
      .topbar__inner { gap: 11px; }
      .brand { font-size: 18px; }
      .topbar__links { gap: 12px; font-size: 13px; }
      .hero { padding: 24px 16px 30px; }
      .search-panel { padding: 21px 18px 17px; }
      .fields { grid-template-columns: 1fr 1fr; gap: 8px; }
      .fields input, .fields select { border: 1px solid #cfd3d6; }
      .search-button { grid-column: span 2; }
    }
    @media (max-width: 500px) {
      .brand-mark { width: 38px; height: 38px; font-size: 13px; }
      .brand { font-size: 16px; }
      .topbar__links { gap: 9px; }
      .topbar__links a { max-width: 72px; line-height: 1.1; }
      .identity__acronym { font-size: 40px; }
      .identity__name { font-size: 16px; }
      .search-actions { align-items: flex-start; }
      .text-button { padding: 8px 9px; font-size: 13px; }
      .advanced { grid-template-columns: 1fr; }
      .results__bar { align-items: flex-start; flex-direction: column; justify-content: center; }
      .result { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-mark" aria-hidden="true">AED</div>
      <a class="brand" href="/">Rejestr AED</a>
      <nav class="topbar__links" aria-label="Nawigacja">
        <a href="/mapa">Mapa AED</a>
        <button class="admin-link" id="admin-toggle" type="button" aria-expanded="false" aria-controls="admin-bar">Administrator</button>
      </nav>
    </div>
  </header>
  <div class="admin-bar" id="admin-bar" hidden>
    <div class="admin-bar__inner" id="admin-bar-inner"></div>
  </div>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="hero__inner">
        <div class="identity">
          <div class="identity__acronym" aria-hidden="true">RAED</div>
          <div class="identity__name">Rejestr<br>Defibrylatorów AED</div>
        </div>
        <div class="intro">
          <strong>Znajdziesz tu lokalizacje automatycznych defibrylatorów zewnętrznych:</strong>
          <ul>
            <li>wprowadzone do publicznych zbiorów danych</li>
            <li>zebrane w jednym, przeszukiwalnym rejestrze</li>
          </ul>
        </div>

        <section class="search-panel" aria-label="Kryteria wyszukiwania AED">
          <h1 id="page-title">Znajdź defibrylator AED</h1>
          <form id="search-form" role="search">
            <div class="fields">
              <input id="query" name="q" type="search" placeholder="Nazwa obiektu lub numer AED" aria-label="Nazwa obiektu lub numer AED">
              <input id="place" name="miejsce" type="search" placeholder="Adres, miejscowość lub lokalizacja" aria-label="Adres, miejscowość lub lokalizacja">
              <select id="access" name="dostep" aria-label="Dostępność">
                <option value="">Każdy rodzaj dostępu</option>
                <option value="publiczny">Dostęp publiczny</option>
                <option value="w_godzinach">W godzinach otwarcia</option>
                <option value="ograniczony">Ograniczony</option>
                <option value="prywatny">Prywatny</option>
                <option value="nieznany">Brak informacji</option>
              </select>
              <button class="search-button" type="submit">
                Szukaj
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
              </button>
            </div>
            <div class="search-actions">
              <button class="nearest-button" id="nearest" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="7"></circle></svg>
                Znajdź najbliższe
              </button>
              <button class="advanced-toggle" type="button" aria-expanded="false" aria-controls="advanced-fields">Wyszukiwanie zaawansowane</button>
              <button class="text-button" id="clear" type="button">Wyczyść kryteria wyszukiwania</button>
            </div>
            <div class="advanced" id="advanced-fields">
              <label class="check">
                <input id="public-only" type="checkbox" name="publiczny">
                Tylko AED z dostępem publicznym
              </label>
            </div>
          </form>
        </section>
      </div>
    </section>

    <section class="results-wrap" aria-labelledby="results-title">
      <div class="results">
        <div class="results__bar">
          <h2 id="results-title">Wyniki wyszukiwania</h2>
          <div class="results__count" id="result-count" aria-live="polite"></div>
        </div>
        <div class="notice" id="notice" role="status">Wczytywanie rejestru AED…</div>
        <div class="result-list" id="result-list"></div>
        <nav class="pagination" id="pagination" aria-label="Strony wyników" hidden>
          <button type="button" id="previous">Poprzednia</button>
          <span id="page-label"></span>
          <button type="button" id="next">Następna</button>
        </nav>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const pageSize = 25;
      const form = document.getElementById("search-form");
      const list = document.getElementById("result-list");
      const notice = document.getElementById("notice");
      const count = document.getElementById("result-count");
      const pagination = document.getElementById("pagination");
      const pageLabel = document.getElementById("page-label");
      const previous = document.getElementById("previous");
      const next = document.getElementById("next");
      let offset = 0;
      let total = 0;
      let requestId = 0;

      const text = (value, fallback = "") => value ? String(value) : fallback;
      const safeSourceUrl = (value) => {
        try {
          const url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
        } catch {
          return "";
        }
      };
      const appendText = (parent, tag, className, value) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = value;
        parent.append(element);
        return element;
      };

      // Rola i tabela kolumn z serwera. Kolumny chronione przychodzą z API tylko dla administratora.
      let role = "publiczny";
      let columnLabels = {};
      const adminBar = document.getElementById("admin-bar");
      const adminInner = document.getElementById("admin-bar-inner");
      const adminToggle = document.getElementById("admin-toggle");

      async function loadRole() {
        try {
          const [r, k] = await Promise.all([
            fetch("/aed-api/auth/rola", { credentials: "same-origin" }).then((x) => x.json()),
            fetch("/aed-api/kolumny", { credentials: "same-origin" }).then((x) => x.json()),
          ]);
          role = r.rola;
          columnLabels = Object.fromEntries(k.kolumny.map((c) => [c.pole, c.nazwa]));
          renderAdminBar(r.dane_demo);
        } catch {
          role = "publiczny";
        }
      }

      function renderAdminBar(demo, error = "") {
        adminInner.replaceChildren();
        adminToggle.textContent = role === "admin" ? "Administrator ✓" : "Administrator";
        if (role === "admin") {
          adminBar.hidden = false;
          appendText(adminInner, "strong", "", "Zalogowano jako administrator.");
          appendText(adminInner, "span", "", demo
            ? "Widzisz też kolumny chronione (dane przykładowe, zmyślone)."
            : "Widzisz też kolumny chronione.");
          const out = document.createElement("button");
          out.type = "button";
          out.textContent = "Wyloguj";
          out.addEventListener("click", async () => {
            await fetch("/aed-api/auth/logout", { method: "POST", credentials: "same-origin" });
            await loadRole();
            adminBar.hidden = true;
            adminToggle.setAttribute("aria-expanded", "false");
            search();
          });
          adminInner.append(out);
          return;
        }
        const loginForm = document.createElement("form");
        loginForm.className = "admin-bar__inner";
        loginForm.style.width = "100%";
        loginForm.style.padding = "0";
        const label = appendText(loginForm, "label", "", "Hasło administratora");
        label.htmlFor = "admin-password";
        const input = document.createElement("input");
        input.type = "password";
        input.id = "admin-password";
        input.autocomplete = "current-password";
        loginForm.append(input);
        const submit = document.createElement("button");
        submit.type = "submit";
        submit.textContent = "Zaloguj";
        loginForm.append(submit);
        if (error) appendText(loginForm, "span", "admin-bar__error", error);
        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const response = await fetch("/aed-api/auth/login", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ haslo: input.value }),
          });
          if (!response.ok) {
            renderAdminBar(false, "Nieprawidłowe hasło.");
            return;
          }
          await loadRole();
          search();
        });
        adminInner.append(loginForm);
      }

      adminToggle.addEventListener("click", () => {
        const open = adminBar.hidden;
        adminBar.hidden = !open;
        adminToggle.setAttribute("aria-expanded", String(open));
        if (open && role !== "admin") document.getElementById("admin-password")?.focus();
      });

      function protectedBox(item) {
        const box = document.createElement("section");
        box.className = "protected";
        appendText(box, "h4", "", "Dane chronione (widoczne tylko dla administratora)");
        const dl = document.createElement("dl");
        item._chronione.forEach((field) => {
          appendText(dl, "dt", "", columnLabels[field] || field);
          appendText(dl, "dd", "", text(item[field], "brak danych od dostawcy"));
        });
        box.append(dl);
        return box;
      }

      function resultCard(item) {
        const card = document.createElement("article");
        card.className = "result";
        const top = document.createElement("div");
        top.className = "result__top";
        appendText(top, "h3", "", text(item.nazwa_obiektu, `Defibrylator AED — ${text(item.id_aed, "bez nazwy")}`));
        const badge = appendText(top, "span", "badge", text(item.dostep_opis, "Brak informacji o dostępie"));
        if (item.dostep === "nieznany" || !item.dostep) badge.classList.add("badge--unknown");
        card.append(top);

        const address = [item.adres, item.pietro ? `piętro ${item.pietro}` : ""].filter(Boolean).join(", ");
        const addressLine = appendText(card, "p", "result__address", address || "Adres nie został podany");
        if (item.odleglosc_m != null) {
          const meters = item.odleglosc_m;
          const distance = meters < 1000 ? `${meters} m` : `${(meters / 1000).toLocaleString("pl-PL", { maximumFractionDigits: 1 })} km`;
          const minutes = Math.max(1, Math.round(meters * 1.3 / 83));
          appendText(addressLine, "span", "result__distance", ` · ${distance} od Ciebie (ok. ${minutes} min pieszo)`);
        }
        if (item.opis_lokalizacji) appendText(card, "p", "result__description", item.opis_lokalizacji);
        const metadata = [
          item.godziny_dostepnosci ? `Godziny: ${item.godziny_dostepnosci}` : "",
          item.dysponent ? `Dysponent: ${item.dysponent}` : "",
          item.data_weryfikacji ? `Weryfikacja: ${item.data_weryfikacji}` : "",
          item.zbior ? `Zbiór: ${item.zbior}` : "",
          "Źródło: dane.gov.pl",
        ].filter(Boolean).join(" · ");
        appendText(card, "p", "result__meta", metadata);
        if (Array.isArray(item._chronione)) card.append(protectedBox(item));

        const links = document.createElement("div");
        links.className = "result__links";
        const mapLink = document.createElement("a");
        mapLink.href = item.odleglosc_m != null
          ? `https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${item.szerokosc},${item.dlugosc}`
          : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${item.szerokosc},${item.dlugosc}`)}`;
        mapLink.target = "_blank";
        mapLink.rel = "noopener noreferrer";
        mapLink.textContent = item.odleglosc_m != null ? "Prowadź do AED" : "Pokaż na mapie";
        links.append(mapLink);
        const sourceUrl = safeSourceUrl(item.zrodlo_url);
        if (sourceUrl) {
          const sourceLink = document.createElement("a");
          sourceLink.href = sourceUrl;
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";
          sourceLink.textContent = "Otwórz źródło danych";
          links.append(sourceLink);
        }
        card.append(links);
        return card;
      }

      async function search() {
        const currentRequest = ++requestId;
        document.getElementById("results-title").textContent = "Wyniki wyszukiwania";
        const params = new URLSearchParams(new FormData(form));
        if (document.getElementById("public-only").checked) params.set("publiczny", "1");
        params.set("limit", String(pageSize));
        params.set("offset", String(offset));
        notice.hidden = false;
        notice.textContent = "Wyszukiwanie w rejestrze…";
        list.replaceChildren();
        count.textContent = "";
        pagination.hidden = true;
        try {
          const response = await fetch(`/aed-api/search?${params.toString()}`, { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error(`Błąd serwera (${response.status})`);
          const data = await response.json();
          if (currentRequest !== requestId) return;
          total = data.razem;
          data.wyniki.forEach((item) => list.append(resultCard(item)));
          count.textContent = `Znaleziono: ${total.toLocaleString("pl-PL")}`;
          notice.hidden = total > 0;
          notice.textContent = total > 0 ? "" : "Brak elementów na liście. Zmień kryteria wyszukiwania.";
          pagination.hidden = total <= pageSize;
          const currentPage = Math.floor(offset / pageSize) + 1;
          pageLabel.textContent = `Strona ${currentPage} z ${Math.ceil(total / pageSize)}`;
          previous.disabled = offset === 0;
          next.disabled = offset + pageSize >= total;
        } catch (error) {
          if (currentRequest !== requestId) return;
          notice.hidden = false;
          notice.textContent = `Nie udało się pobrać rejestru AED. ${error.message}`;
        }
      }

      // „Znajdź najbliższe”: lokalizacja przeglądarki -> najbliższe AED z rejestru (API /aed-api/nearest)
      const title = document.getElementById("results-title");
      document.getElementById("nearest").addEventListener("click", () => {
        const currentRequest = ++requestId;
        list.replaceChildren();
        count.textContent = "";
        pagination.hidden = true;
        notice.hidden = false;
        if (!navigator.geolocation) {
          notice.textContent = "Ta przeglądarka nie udostępnia lokalizacji. Wpisz adres lub miejscowość.";
          return;
        }
        notice.textContent = "Ustalanie Twojej lokalizacji…";
        navigator.geolocation.getCurrentPosition(async (position) => {
          const params = new URLSearchParams({ lat: position.coords.latitude, lon: position.coords.longitude,
                                               n: "10", tylko_dostepne: "0" });
          try {
            const response = await fetch(`/aed-api/nearest?${params}`, { headers: { Accept: "application/json" } });
            if (!response.ok) throw new Error(`Błąd serwera (${response.status})`);
            const data = await response.json();
            if (currentRequest !== requestId) return;
            title.textContent = "Najbliższe AED";
            data.wyniki.forEach((item) => list.append(resultCard(item)));
            count.textContent = data.wyniki.length ? `Pokazano: ${data.wyniki.length}` : "";
            notice.hidden = data.wyniki.length > 0;
            notice.textContent = data.wyniki.length ? "" : "W pobliżu nie ma AED w rejestrze.";
          } catch (error) {
            if (currentRequest !== requestId) return;
            notice.textContent = `Nie udało się pobrać najbliższych AED. ${error.message}`;
          }
        }, () => {
          if (currentRequest !== requestId) return;
          notice.textContent = "Nie udało się ustalić lokalizacji. Zezwól przeglądarce na dostęp do lokalizacji albo wpisz adres.";
        }, { enableHighAccuracy: true, timeout: 8000 });
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        offset = 0;
        search();
      });
      document.querySelector(".advanced-toggle").addEventListener("click", (event) => {
        const button = event.currentTarget;
        const open = button.getAttribute("aria-expanded") !== "true";
        button.setAttribute("aria-expanded", String(open));
        document.getElementById("advanced-fields").classList.toggle("is-open", open);
      });
      document.getElementById("clear").addEventListener("click", () => {
        form.reset();
        offset = 0;
        search();
      });
      previous.addEventListener("click", () => {
        offset = Math.max(0, offset - pageSize);
        search();
      });
      next.addEventListener("click", () => {
        if (offset + pageSize < total) {
          offset += pageSize;
          search();
        }
      });
      loadRole().then(search);
    })();
  </script>
</body>
</html>
